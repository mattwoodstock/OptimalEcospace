# Builds the Live Solver download (only the files needed to run it), checks that the
# unpacked package runs on its own on Windows, and on `main` publishes it to the
# `live-solver` release so the website link always serves the current version:
#   https://github.com/mattwoodstock/OptimalEcospace/releases/download/live-solver/OptimalEcospace-LiveSolver.zip
name: Live Solver package

on:
  push:
    paths:
      - "R/LiveSolver/**"
      - "Inputs/**"
      - "Model/**"
      - "Start Live Solver.R"
      - ".github/workflows/live-solver-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript -e "install.packages(c('shiny', 'bslib', 'DT', 'processx', 'terra', 'xml2', 'jsonlite'), type = 'binary')"

      - name: Build package
        run: Rscript R/LiveSolver/build_package.R dist

      - name: Unpack the package
        run: |
          Expand-Archive dist/OptimalEcospace-LiveSolver.zip -DestinationPath "$env:RUNNER_TEMP/pkg"
          Expand-Archive dist/OptimalEcospace-LiveSolver.zip -DestinationPath "$env:RUNNER_TEMP/test"

      - name: Smoke test the unpacked package
        run: Rscript R/LiveSolver/check_package.R "$env:RUNNER_TEMP/test/OptimalEcospace-LiveSolver"

      - uses: actions/upload-artifact@v4
        with:
          # The clean unpacked folder (not the tested copy), so the artifact download is a single zip
          name: OptimalEcospace-LiveSolver
          path: ${{ runner.temp }}/pkg

      - name: Publish to the live-solver release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Live Solver download built from ${GITHUB_SHA::7}. Unzip, open 'Start Live Solver.R' in RStudio and click Source."
          if gh release view live-solver >/dev/null 2>&1; then
            gh release edit live-solver --notes "$notes"
          else
            gh release create live-solver --title "Live Solver (latest)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload live-solver dist/OptimalEcospace-LiveSolver.zip --clobber
